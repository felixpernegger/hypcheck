# Native build of hypcheck/scripts/HypCheck.lean (batteries port): a worker then holds one environment
# instead of two (`lean --run` keeps the script's own elaboration environment). Same toolchain as Batteries.
name = "hctool"

[[lean_exe]]
name = "hypcheck"
root = "HypCheck"
srcDir = "../scripts"
supportInterpreter = true

