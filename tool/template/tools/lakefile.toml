# Native executables of the hypcheck tools, built with the analysed library's toolchain (scripts/build_tools.sh copies
# its lean-toolchain here). Via `lean --run` a tool importing Mathlib costs ~1.6-1.9 GB anonymous memory per process
# (core oleans read twice); natively ~0.2 GB (PLAYBOOK.md §5, "Native tools").
name = "hctools"
srcDir = "../scripts"
defaultTargets = ["HCRepair", "hypcheck", "propparams", "unused", "unusedtrans", "unusedemit", "instderivable", "nectrans", "twins", "unusedpriv", "unusedtranspriv", "instderivablepriv", "nectranspriv", "twinspriv"]

[[lean_lib]]
name = "HCRepair"
roots = ["HCRepair"]

[[lean_exe]]
name = "hypcheck"
root = "HypCheck"
supportInterpreter = true

[[lean_exe]]
name = "propparams"
root = "PropParams"
supportInterpreter = true

[[lean_exe]]
name = "unused"
root = "Unused"
supportInterpreter = true

[[lean_exe]]
name = "unusedtrans"
root = "UnusedTrans"
supportInterpreter = true

[[lean_exe]]
name = "unusedemit"
root = "UnusedEmit"
supportInterpreter = true

[[lean_exe]]
name = "instderivable"
root = "InstDerivable"
supportInterpreter = true

[[lean_exe]]
name = "nectrans"
root = "NecTrans"
supportInterpreter = true

[[lean_exe]]
name = "twins"
root = "Twins"
supportInterpreter = true

[[lean_exe]]
name = "unusedpriv"
root = "priv.UnusedPriv"
supportInterpreter = true

[[lean_exe]]
name = "unusedtranspriv"
root = "priv.UnusedTransPriv"
supportInterpreter = true

[[lean_exe]]
name = "instderivablepriv"
root = "priv.InstDerivablePriv"
supportInterpreter = true

[[lean_exe]]
name = "nectranspriv"
root = "priv.NecTransPriv"
supportInterpreter = true

[[lean_exe]]
name = "twinspriv"
root = "priv.TwinsPriv"
supportInterpreter = true
